name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: '1'
  UV_PYTHON: '3.14'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.14'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: make lint
      - run: uv run ruff format --check src

  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.14'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: make types

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_NAME: hackaton_fin_ci
    services:
      postgres:
        image: postgres:17.11-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: hackaton_fin_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d hackaton_fin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true # Required by python-coverage-comment-action v3.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.14'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - name: BDD and pytest with coverage
        run: |
          uv run coverage erase
          make tests-coverage
      - name: Publish coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Export coverage
        if: ${{ !cancelled() }}
        run: |
          uv run coverage xml
          uv run coverage html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: warn

  image:
    name: image
    needs: [lint, types, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Harbor (registry.mortypython.ru, project fin). Учетка — robot account,
      # vars.HARBOR_USERNAME / secrets.HARBOR_TOKEN в настройках репозитория.
      - name: Login to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.mortypython.ru
          username: ${{ vars.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Build without publishing
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Тег для Flux ImagePolicy: <ветка>-<UTC YYYYMMDDhhmmss>-<sha12>.
      # Flux достаёт таймстамп numerical-extract'ом и катит старший (см.
      # fin-department-k8s: apps/hackaton-fin-deployment/image-policy.yaml).
      - name: Compute image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: tag
        run: echo "image_tag=main-$(date -u +%Y%m%d%H%M%S)-$(echo $GITHUB_SHA | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.mortypython.ru/fin/hackaton-fin-department:${{ steps.tag.outputs.image_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
