name: Deploy
run-name: Deploy ${{ inputs.commit_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Published main commit (full SHA); empty means the selected main HEAD'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published main commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          sha="${COMMIT_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Expected a full commit SHA'; exit 1; }
          sha="${sha,,}"
          git merge-base --is-ancestor "$sha" origin/main
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&status=success&per_page=100" \
            --jq '.workflow_runs[0].id // empty')
          [[ -n "$run_id" ]] || { echo 'No successful Quality push run for this commit'; exit 1; }
          published=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "image" and .conclusion == "success") | .steps[] | select(.name == "Build and push" and .conclusion == "success")] | length')
          [[ "$published" -gt 0 ]] || { echo 'The commit has no successful image publication'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Prepare deployment files
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPONAME: ${{ vars.DOCKERHUB_REPONAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_NAME: ${{ secrets.POSTGRES_NAME }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/deploy"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          required = (
              'SERVER_HOST', 'SERVER_PORT', 'SERVER_USERNAME', 'SERVER_SSH_PRIVATE_KEY',
              'SSH_KNOWN_HOSTS', 'POSTGRES_USER', 'POSTGRES_PASSWORD', 'POSTGRES_NAME',
              'DOCKERHUB_USERNAME', 'DOCKERHUB_REPONAME', 'DOCKERHUB_TOKEN',
          )
          for name in required:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing setting: {name}')
          for name, pattern in {
              'SERVER_HOST': r'[a-zA-Z0-9][a-zA-Z0-9.:-]*',
              'SERVER_USERNAME': r'[a-z_][a-z0-9_-]*',
              'DOCKERHUB_USERNAME': r'[a-z0-9][a-z0-9_-]*',
              'DOCKERHUB_REPONAME': r'[a-z0-9]+(?:[._-][a-z0-9]+)*',
          }.items():
              if not re.fullmatch(pattern, os.environ[name]):
                  raise SystemExit(f'Invalid setting: {name}')
          app_port = os.environ.get('APP_PORT') or '8080'
          for value in (os.environ['SERVER_PORT'], app_port):
              if not re.fullmatch(r'[0-9]{1,5}', value) or not 1 <= int(value) <= 65535:
                  raise SystemExit('Invalid SSH or application port')
          values = {name: os.environ[name] for name in ('POSTGRES_USER', 'POSTGRES_PASSWORD', 'POSTGRES_NAME')}
          values.update(APP_PORT=app_port, POSTGRES_HOST='hackaton-fin-postgres', POSTGRES_PORT='5432', UV_LOCKED='1')
          with (Path(os.environ['RUNNER_TEMP']) / 'deploy/.env').open('w') as output:
              for name, value in values.items():
                  if any(char in value for char in '\r\n\0'):
                      raise SystemExit(f'{name} must be a single-line value')
                  output.write(name + "='" + value.replace("'", "\\'") + "'\n")
          PY
          printf '%s\n' "$SERVER_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy/ssh_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy/known_hosts"
          printf '%s' "$DOCKERHUB_TOKEN" > "$RUNNER_TEMP/deploy/registry_token"
          printf '%s' "$DOCKERHUB_USERNAME" > "$RUNNER_TEMP/deploy/registry_user"
          cat > "$RUNNER_TEMP/deploy/ssh_config" <<EOF
          Host deployment
            HostName $SERVER_HOST
            User $SERVER_USERNAME
            Port $SERVER_PORT
            IdentityFile $RUNNER_TEMP/deploy/ssh_key
            UserKnownHostsFile $RUNNER_TEMP/deploy/known_hosts
            StrictHostKeyChecking yes
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          git show "${RELEASE_SHA}:docker-compose.yml" > "$RUNNER_TEMP/deploy/docker-compose.yml"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve immutable image digest
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPONAME }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:sha-$RELEASE_SHA" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'HACKATON_FIN_DEPARTMENT_IMAGE=%s@%s\n' "$IMAGE_REPOSITORY" "$digest" >> "$RUNNER_TEMP/deploy/.env"
          printf '### Deploy\nCommit: %s\nImage: %s@%s\n' "$RELEASE_SHA" "$IMAGE_REPOSITORY" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Transfer and deploy
        run: |
          config="$RUNNER_TEMP/deploy/ssh_config"
          staging="/opt/hackaton-fin-department/incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -F "$config" deployment "umask 077; mkdir -p '$staging'"
          scp -F "$config" "$RUNNER_TEMP/deploy/"{.env,docker-compose.yml,registry_user,registry_token} "deployment:$staging/"
          ssh -F "$config" deployment "bash -s -- '$staging'" <<'REMOTE'
          set -euo pipefail
          umask 077
          staging=$1
          root=/opt/hackaton-fin-department
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG" "$staging"' EXIT
          docker login --username "$(cat "$staging/registry_user")" --password-stdin < "$staging/registry_token"
          rm -f -- "$staging/registry_token"
          install -m 600 "$staging/.env" "$root/.env"
          install -m 600 "$staging/docker-compose.yml" "$root/docker-compose.yml"
          compose=(docker compose --project-name hackaton-fin-department --env-file "$root/.env" -f "$root/docker-compose.yml")
          "${compose[@]}" config --quiet
          "${compose[@]}" pull hackaton-fin-department hackaton-fin-postgres
          "${compose[@]}" up -d --no-build --wait --wait-timeout 180 hackaton-fin-postgres
          "${compose[@]}" run --rm --no-deps -T hackaton-fin-department make migrate
          "${compose[@]}" up -d --no-build --no-deps --wait --wait-timeout 180 hackaton-fin-department
          "${compose[@]}" ps
          REMOTE
      - name: Remove temporary deployment files
        if: always()
        run: |
          config="$RUNNER_TEMP/deploy/ssh_config"
          if [[ -f "$config" ]]; then
            staging="/opt/hackaton-fin-department/incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            ssh -F "$config" deployment "rm -rf -- '$staging'" || true
          fi
          rm -rf -- "$RUNNER_TEMP/deploy"
