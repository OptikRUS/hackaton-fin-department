services:
  hackaton-fin-department:
    image: ${HACKATON_FIN_DEPARTMENT_IMAGE:-hackaton-fin-department:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ADDRESS: "0.0.0.0"
      APP_PORT: "8080"
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST is required}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_NAME: ${POSTGRES_NAME:?POSTGRES_NAME is required}
    depends_on:
      hackaton-fin-postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8080/health", timeout=5).close()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  hackaton-fin-postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    command: ["postgres", "-p", "${POSTGRES_PORT:?POSTGRES_PORT is required}"]
    environment:
      POSTGRES_DB: ${POSTGRES_NAME:?POSTGRES_NAME is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGPORT: ${POSTGRES_PORT:?POSTGRES_PORT is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}"
    networks:
      default:
        aliases:
          - ${POSTGRES_HOST:?POSTGRES_HOST is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -d "$${POSTGRES_DB}" -U "$${POSTGRES_USER}"
          -p "$${PGPORT}"
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
